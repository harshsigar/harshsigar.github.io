<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2c" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="barGradActive" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#p3Grad)" rx="12" />
  
  <rect x="40" y="30" width="520" height="290" rx="8" fill="#0b0314" stroke="#581c87" stroke-width="1.5" />
  <circle cx="60" cy="50" r="5" fill="#ef4444" />
  <circle cx="75" cy="50" r="5" fill="#f59e0b" />
  <circle cx="90" cy="50" r="5" fill="#10b981" />
  <text x="115" y="54" font-family="monospace" font-size="11" fill="#c084fc">Algorithm &amp; Sorting Visualizer</text>

  <!-- Control panel -->
  <rect x="60" y="75" width="80" height="22" rx="4" fill="#a855f7" />
  <text x="75" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">▶ Play</text>
  
  <rect x="150" y="75" width="90" height="22" rx="4" fill="#3b0764" stroke="#7e22ce" />
  <text x="160" y="90" font-family="monospace" font-size="11" fill="#e9d5ff">QuickSort</text>

  <rect x="250" y="75" width="90" height="22" rx="4" fill="#3b0764" stroke="#7e22ce" />
  <text x="260" y="90" font-family="monospace" font-size="11" fill="#e9d5ff">MergeSort</text>

  <text x="360" y="90" font-family="monospace" font-size="11" fill="#9333ea">Speed: 50ms | Array: 18</text>

  <!-- Sorting Bar visualization -->
  <g transform="translate(60, 120)">
    <rect x="0" y="110" width="18" height="50" rx="2" fill="url(#barGrad1)" />
    <rect x="26" y="80" width="18" height="80" rx="2" fill="url(#barGrad1)" />
    <rect x="52" y="130" width="18" height="30" rx="2" fill="url(#barGrad1)" />
    <rect x="78" y="40" width="18" height="120" rx="2" fill="url(#barGrad1)" />
    <rect x="104" y="60" width="18" height="100" rx="2" fill="url(#barGrad1)" />
    <rect x="130" y="20" width="18" height="140" rx="2" fill="url(#barGradActive)" />
    <rect x="156" y="30" width="18" height="130" rx="2" fill="url(#barGradActive)" />
    <rect x="182" y="90" width="18" height="70" rx="2" fill="url(#barGrad1)" />
    <rect x="208" y="120" width="18" height="40" rx="2" fill="url(#barGrad1)" />
    <rect x="234" y="50" width="18" height="110" rx="2" fill="url(#barGrad1)" />
    <rect x="260" y="70" width="18" height="90" rx="2" fill="url(#barGrad1)" />
    <rect x="286" y="10" width="18" height="150" rx="2" fill="url(#barGrad1)" />
    <rect x="312" y="100" width="18" height="60" rx="2" fill="url(#barGrad1)" />
    <rect x="338" y="35" width="18" height="125" rx="2" fill="url(#barGrad1)" />
    <rect x="364" y="115" width="18" height="45" rx="2" fill="url(#barGrad1)" />
    <rect x="390" y="65" width="18" height="95" rx="2" fill="url(#barGrad1)" />
    <rect x="416" y="15" width="18" height="145" rx="2" fill="url(#barGrad1)" />
    <rect x="442" y="45" width="18" height="115" rx="2" fill="url(#barGrad1)" />
  </g>

  <text x="60" y="300" font-family="monospace" font-size="11" fill="#c084fc">Comparing element at index 5 and 6: O(n log n) average time complexity</text>
</svg>

