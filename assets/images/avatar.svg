<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#avatarGrad)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Stylized Developer Silhouette with Headset & Laptop -->
  <!-- Head -->
  <circle cx="100" cy="72" r="30" fill="url(#avatarGrad)" opacity="0.9" />
  <!-- Glasses / Visor -->
  <rect x="80" y="68" width="40" height="12" rx="6" fill="#0f172a" />
  <rect x="83" y="71" width="14" height="6" rx="3" fill="#38bdf8" />
  <rect x="103" y="71" width="14" height="6" rx="3" fill="#38bdf8" />
  <!-- Body / Hoodie -->
  <path d="M 50 160 C 50 115, 150 115, 150 160 Z" fill="url(#avatarGrad)" opacity="0.85" />
  <!-- Laptop Base -->
  <path d="M 65 155 L 135 155 L 145 168 L 55 168 Z" fill="#334155" />
  <!-- Code brackets glow on chest -->
  <text x="100" y="145" font-family="monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;dev /&gt;</text>
</svg>

